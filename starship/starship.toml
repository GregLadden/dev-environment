format = """
$directory$git_branch$git_status$fill$all$character
"""
# $directory\
# $git_branch\
# $git_status\
# $fill\
# $python\
# $lua\
# $golang\
# $haskell\
# $rust\
# $ruby\
# $aws\
# $docker_context\
# $jobs\
# $cmd_duration\
# $line_break\
# $character"""
#
add_newline = true
palette = "rose-pine"
[palettes.rose-pine]
overlay = '#26233a'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#3e8fb0'
foam = '#9ccfd8'
iris = '#c4a7e7'
text = '#e0def4'

[character]
success_symbol = '[󰜴](fg:pine) '
error_symbol = '[󰜴](fg:love) '

[directory]
style = ''
format = '[$path](fg:foam)'
truncation_length = 3
truncation_symbol = '/'
home_symbol = ' '
truncate_to_repo = false 

# Username configuration
[username]
show_always = false 
style_user = "fg:foam"
style_root = "fg:pine"
format = "[$user]($style)@"

# Hostname configuration
[hostname]
ssh_only = true 
style = "fg:pine"
format = "[$hostname]($style) "

[git_branch]
style = 'fg:iris'
symbol = ' '
format = ' [$symbol](fg:pine)[$branch](fg:iris) ($style)'

[git_status]
style = 'bold gold'
format = '([$all_status$ahead_behind]($style) )'

[fill]
style = 'fg:overlay'

[python]
style = 'fg:foam'
symbol = ' '
format = '[ ${virtualenv}](fg:base) [ $version](fg:base) '
pyenv_version_name = false 
pyenv_prefix = ''

[lua]
format = '[$symbol($version )]($style)'
symbol = ' '
style = 'fg:foam'

# Hide the Node.js symbol (we'll use Svelte instead)
[nodejs]
disabled = true

[custom.svelte]
description = "Svelte version"
command = '''
  if [ -f package.json ]; then
    grep '"svelte":' package.json | sed -E 's/.*"svelte": *"[^0-9]*([0-9.]+)".*/\1/'
  fi
'''
when = 'test -f package.json && grep -q "svelte" package.json'
symbol = " "
format = "[$symbol$output ](fg:rose)"

[golang]
format = '[$symbol($version )]($style)'
style = 'bold fg:foam'
symbol = ' '
detect_extensions = ['go']
not_capable_style = 'bold fg:love'

[haskell]
style = 'fg:foam'
symbol = ' '

[rust]
style = 'fg:iris'
symbol = ' '

[ruby]
style = 'fg:foam'
symbol = ' '

[package]
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'fg:gold'
format = '[$symbol($profile )([$duration] )]($style)'

[docker_context]
symbol = ' '
style = 'fg:pine'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'fg:love'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:rose'
format = '[$duration]($style)'

[kubernetes]
symbol = '󱃾 '
style = 'fg:iris'
format = '[$symbol$context( \($namespace\))]($style) '
disabled = false
